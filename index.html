<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Keari Eggers is a senior software engineer focused on frontend architecture, developer experience, and reliable delivery for complex products."
    />
    <meta name="author" content="Keari Eggers" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1f6f78" />
    <meta name="theme-color" content="#f4f1e9" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("portfolio-theme");
          const theme =
            savedTheme ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content =
            theme === "dark" ? "#07051e" : "#f4f1e9";
        } catch {
          // Keep the light theme if storage or media preferences are unavailable.
        }
      })();
    </script>
    <title>Keari Eggers | Senior Software Engineer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
